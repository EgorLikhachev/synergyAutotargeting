[camera]
device = "/dev/video0"
width = 640
height = 480
fps = 60
format = "mjpeg"
queue_depth = 4

[tracker]
backend = "rknn"

[commander]
enabled = true
rate_hz = 30

[logging]
# diag: telemetry.jsonl/perf.jsonl пишутся — telemetry_report.py в bench.sh
# без них читает пустоту (аудит 2026-09-10).
mode = "diag"
