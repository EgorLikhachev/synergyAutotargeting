# synergyAutotargeting — пример конфигурации
# Копируйте в config.toml и правьте под своё железо.

[camera]
device = "/dev/video0"
width = 640
height = 480
fps = 30
format = "mjpeg"
queue_depth = 4

[detector]
model_path = "models/model_5_dynamic_rk3588.rknn"
input_size = 640
conf_threshold = 0.45
nms_threshold = 0.45
# Имена классов заполняются после эмпирической проверки модели (см. docs/HARDWARE_TEST_RESULTS.md)
class_names = []

[tracker]
backend = "tract"           # "tract" (CPU) | "rknn" (NPU, фаза C — трек <10 мс)
backbone_path = "models/nanotrack_backbone_127.onnx"
backbone_search_path = "models/nanotrack_backbone_sim.onnx"
head_path = "models/nanotrack_head_sim.onnx"
swap_rb = false
min_track_score = 0.30
# RKNN-модели (backend = "rknn"; из tools/convert_nanotrack.py):
rknn_backbone_z = "models/nanotrack_backbone_127.rknn"
rknn_backbone_x = "models/nanotrack_backbone_255.rknn"
rknn_head = "models/nanotrack_head.rknn"

[pipeline]
detect_every_n = 10        # детекция раз в N кадров (10 => ~3 Гц при 30 FPS)
iou_confirm = 0.30         # IoU детекции с треком для подтверждения цели
lost_patience = 3          # кадров с низким score до форс-детекции
min_detect_conf = 0.45
priority_classes = []      # индексы приоритетных классов детектора
use_stabilizer = true

[output]
dir = "data"
snapshot_every = 30        # OSD-снапшот каждые N кадров
telemetry = true
duration_secs = 0          # 0 = до Ctrl+C

[stream]
enabled = false            # слушающий MJPEG-сервер (или флаг --stream)
bind = "0.0.0.0:8080"      # смотреть с борта/localhost
push_to = ""               # push-режим: "192.168.0.174:9000" — борт сам
                           # подключается к tools/viewer.py (рекомендуется:
                           # исходящие TCP работают даже при quirk ядра)
frame_div = 2              # отдавать каждый 2-й кадр (~15 FPS)
quality = 80               # качество JPEG (как у снапшотов)
record = ""                # запись стрима в M-JPEG файл (путь) или --record PATH

[commander]
enabled = false            # контур наведения (фаза D)
device = "/dev/ttyS6"      # UART полётника (bkb); нет устройства → noop+WARN
baud = 115200
rate_hz = 30               # частота RC-кадров (как bkb)
kp = 2.0                   # усиления осей (X=Y на старте)
ki = 0.0
kd = 0.0
deadband_px = 6.0          # мёртвая зона
slew_us = 8.0              # лимит шага, мкс/тик
swap_axes = false          # камера повёрнута на 90° (как в bkb)
reverse_x = false
reverse_y = false
throttle_us = 1310         # ch3
aux1_us = 1950             # ch4 (ARM-уровень)
lead_s = 0.0               # упреждение наведения, с (0 — выкл)
lead_alpha = 0.25          # сглаживание оценки скорости цели
stick_rate_px_s = 600.0    # скорость платформы при полном стике (фидфорвард)
simulate = false           # true — без UART (тесты контура)
